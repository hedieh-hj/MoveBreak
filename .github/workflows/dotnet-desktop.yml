name: Build MoveBreak for Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-win-x64:
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore Windows runtime packages
        run: dotnet restore MoveBreak.csproj --runtime win-x64

      - name: Publish the standalone executable
        run: >-
          dotnet publish MoveBreak.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishProfile=Properties/PublishProfiles/win-x64.pubxml
          --output artifacts/MoveBreak-win-x64

      - name: Verify the executable
        shell: pwsh
        run: |
          $executable = "artifacts/MoveBreak-win-x64/MoveBreak.exe"
          if (-not (Test-Path -LiteralPath $executable)) {
            throw "The standalone MoveBreak.exe was not produced."
          }
          Get-Item -LiteralPath $executable | Format-List Name, Length, LastWriteTime

      - name: Upload the standalone executable
        uses: actions/upload-artifact@v7
        with:
          name: MoveBreak-win-x64
          path: artifacts/MoveBreak-win-x64/MoveBreak.exe
          if-no-files-found: error

      - name: Attach the executable to a tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME
          "artifacts/MoveBreak-win-x64/MoveBreak.exe"
          --title "MoveBreak $env:GITHUB_REF_NAME"
          --generate-notes
